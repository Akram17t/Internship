# Local PostgreSQL for development only. Not used in production deployment
# (see docker-compose.yml / README Docker Deployment section), and not wired
# into any EC2/CI pipeline. Start with:
#
#   docker compose -f docker-compose.dev-db.yml up -d
#
# Then set DATABASE_URL in your local .env to match POSTGRES_* below, e.g.:
#   DATABASE_URL=postgresql+psycopg://hr_agent:hr_agent_dev_password@localhost:5432/hr_agent
services:
  postgres:
    image: postgres:16-alpine
    container_name: hr_agent_postgres_dev
    environment:
      POSTGRES_USER: hr_agent
      POSTGRES_PASSWORD: hr_agent_dev_password
      POSTGRES_DB: hr_agent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hr_agent_postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_agent -d hr_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  hr_agent_postgres_dev_data:
